# Sentinel example configuration (version 0.1)
#
# Validate it with:
#   sentinel --validate --config config.example.yaml
#
# Scope reminder: 0.1 supports HTTP/HTTPS only, a `defaults` + `targets` layout
# (no templates), a fixed label-tag set, and a single total timeout per target.
# See configuration.md for the full specification.

# ---------------------------------------------------------------------------
# Global defaults. Every target inherits these unless it sets its own value.
# The merge rule is trivial: a value on the target wins, otherwise the default
# applies, otherwise Sentinel's built-in default.
# ---------------------------------------------------------------------------
defaults:
  interval: 30s          # how often each target is probed
  timeout: 10s           # total per-run timeout (covers all redirect hops)
  http:
    method: GET          # GET, HEAD, POST, PUT, PATCH or DELETE
    follow_redirects: true
    max_redirects: 10
    max_body_bytes: 1048576   # 1 MiB cap on the body read (DoS safeguard)

# ---------------------------------------------------------------------------
# Targets. Each target needs a unique name and exactly one protocol block
# (only `http` in 0.1).
#
# Allowed tag keys (become Prometheus labels): environment, location, service.
# Any other tag key is rejected at validation time.
# ---------------------------------------------------------------------------
targets:

  # Minimal target: inherits every default, expects HTTP 200.
  - name: homepage
    tags:
      service: frontend
      environment: production
    http:
      url: https://example.org

  # Overrides the interval, sends request headers + Basic auth, and validates
  # status, a body pattern and a response header.
  - name: api-health
    interval: 15s
    tags:
      service: backend
      environment: production
      location: datacenter-1
    http:
      url: https://api.example.org/health
      method: GET
      headers:               # request headers (Host sets the request host)
        X-Api-Key: "abc123"
        Accept: application/json
      basic_auth:            # or use bearer_token: "..." (mutually exclusive)
        username: monitor
        password: "s3cret"
      expect:
        status: 200
        body_regex:
          - "\"status\"\\s*:\\s*\"(ok|healthy)\""
        headers:             # response-header expectations (validation)
          Content-Type: application/json

  # POST with a JSON request body (Content-Type via headers). Redirects, if any,
  # are followed as a bodyless GET.
  - name: ingest
    interval: 30s
    tags:
      service: backend
      environment: production
    http:
      url: https://api.example.org/ingest
      method: POST
      headers:
        Content-Type: application/json
      body: |
        {"probe": "sentinel", "ping": true}
      expect:
        status: 202

  # Cheap availability + TLS check using HEAD (no body downloaded).
  - name: docs-availability
    interval: 5m
    tags:
      service: documentation
      environment: production
    http:
      url: https://docs.example.org/
      method: HEAD

  # Tighter per-target settings: shorter timeout, no redirect following.
  - name: login-endpoint
    interval: 20s
    timeout: 5s
    tags:
      service: auth
      environment: production
      location: datacenter-1
    http:
      url: https://login.example.org/
      follow_redirects: false
      expect:
        status: 200

  # Per-target max_body_bytes override: raise the cap on a large page so the
  # full download time is measured (overrides the 1 MiB default above).
  - name: large-report
    tags:
      service: reporting
      environment: production
    http:
      url: https://example.org/report
      max_body_bytes: 8388608   # 8 MiB

  # Opt out of the body cap entirely (read the full body; memory then grows with
  # timeout x bandwidth, not a byte limit). Removes the DoS safeguard, so it is
  # only allowed per target (never in defaults) — use only for trusted targets.
  - name: full-transfer
    timeout: 30s
    tags:
      service: reporting
      environment: production
    http:
      url: https://example.org/full
      max_body_bytes: 0         # 0 = no cap

  # DNS target (0.2): resolve an A record via a specific resolver and check it.
  - name: dns-a-record
    interval: 30s
    tags:
      service: dns
      environment: production
    dns:
      server: 1.1.1.1
      query: example.org
      type: A
      expected:
        - 93.184.216.34

  # DNS MX check (no expected values: success = NOERROR, count via metrics).
  - name: dns-mx-record
    interval: 1m
    tags:
      service: dns
      environment: production
    dns:
      server: 1.1.1.1
      query: example.org
      type: MX

  # TCP connection check with optional banner validation (e.g. the SSH greeting).
  # Without banner_regex it only checks that a connection can be established.
  - name: ssh
    interval: 1m
    tags:
      service: ssh
      environment: production
    tcp:
      address: ssh.example.org:22
      expect:
        banner_regex:
          - "^SSH-2.0"
