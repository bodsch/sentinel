# Sentinel example configuration (version 0.2)
#
# Validate it with:
#   sentinel --validate --config config.example.yaml
#
# Scope reminder: 0.2 supports HTTP/HTTPS, DNS and TCP targets, a `defaults` +
# `targets` layout (no templates), a fixed label-tag set, and a single total
# timeout per target. See configuration.md for the full specification.

# ---------------------------------------------------------------------------
# Global defaults. Every target inherits these unless it sets its own value.
# The merge rule is trivial: a value on the target wins, otherwise the default
# applies, otherwise Sentinel's built-in default.
# ---------------------------------------------------------------------------
defaults:
  interval: 30s          # how often each target is probed
  timeout: 10s           # total per-run timeout (covers all redirect hops)
  http:
    method: GET          # GET, HEAD, POST, PUT, PATCH or DELETE
    follow_redirects: true
    max_redirects: 10
    max_body_bytes: 1048576   # 1 MiB cap on the body read (DoS safeguard)

# ---------------------------------------------------------------------------
# Targets. Each target needs a unique name and exactly one protocol block
# (`http`, `dns` or `tcp`).
#
# Allowed tag keys (become Prometheus labels): environment, location, service.
# Any other tag key is rejected at validation time.
# ---------------------------------------------------------------------------
targets:

  # Minimal target: inherits every default, expects HTTP 200.
  - name: homepage
    tags:
      service: frontend
      environment: production
    http:
      url: https://example.org

  # Overrides the interval, sends request headers + Basic auth, and validates
  # status, a body pattern and a response header.
  - name: api-health
    interval: 15s
    tags:
      service: backend
      environment: production
      location: datacenter-1
    http:
      url: https://api.example.org/health
      method: GET
      headers:               # request headers (Host sets the request host)
        X-Api-Key: "abc123"
        Accept: application/json
      basic_auth:            # or use bearer_token: "..." (mutually exclusive)
        username: monitor
        password: "s3cret"
      expect:
        status: 200
        body_regex:
          - "\"status\"\\s*:\\s*\"(ok|healthy)\""
        headers:             # response-header expectations (validation)
          Content-Type: application/json
        json:                # JSONPath assertions on the response body
          - path: "$.status"
            equals: "ok"
          - path: "$.uptime"  # existence only

  # POST with a JSON request body (Content-Type via headers). Redirects, if any,
  # are followed as a bodyless GET.
  - name: ingest
    interval: 30s
    tags:
      service: backend
      environment: production
    http:
      url: https://api.example.org/ingest
      method: POST
      headers:
        Content-Type: application/json
      body: |
        {"probe": "sentinel", "ping": true}
      expect:
        status: 202

  # Cheap availability + TLS check using HEAD (no body downloaded).
  - name: docs-availability
    interval: 5m
    tags:
      service: documentation
      environment: production
    http:
      url: https://docs.example.org/
      method: HEAD

  # Tighter per-target settings: shorter timeout, no redirect following.
  - name: login-endpoint
    interval: 20s
    timeout: 5s
    tags:
      service: auth
      environment: production
      location: datacenter-1
    http:
      url: https://login.example.org/
      follow_redirects: false
      expect:
        status: 200

  # Internal HTTPS endpoint served by a private CA: verify the chain against that
  # CA bundle (secure). Without a tls block, verification uses the system roots.
  - name: internal-api
    interval: 30s
    tags:
      service: backend
      environment: production
      location: datacenter-1
    http:
      url: https://api.internal.example/health
      tls:
        ca_file: /etc/sentinel/internal-ca.pem
      expect:
        status: 200

  # Opt-in TLS expectations. Without a tls.expect block nothing new can fail a
  # probe — the certificate metrics are exported either way. Each field here has
  # its own failure reason: min_days_remaining -> certificate_expiring, the rest
  # -> tls_policy_violation. They are evaluated after the handshake and after the
  # response validators, so a policy breach never hides a real functional error.
  # Mutually exclusive with insecure_skip_verify.
  - name: public-site-with-policy
    interval: 1m
    tags:
      service: web
      environment: production
    http:
      url: https://www.example.org/
      tls:
        expect:
          # Whole days the certificate must stay valid. Spans the entire chain,
          # so an intermediate or root expiring before the leaf trips it too.
          min_days_remaining: 21
          # Lowest acceptable negotiated version: "1.2" or "1.3".
          min_version: "1.3"
          # Require a stapled OCSP response whose status is "good". Many large
          # sites do not staple at all (Let's Encrypt retired OCSP), so enable
          # this only where you know the server does.
          require_ocsp_stapling: true
          # Pin the issuing CA by common name: an unannounced CA change fails.
          issuer_regex: "Let's Encrypt"

  # Self-signed appliance you cannot otherwise verify: accept any certificate.
  # sentinel_tls_certificate_valid still reports the real (untrusted) validity,
  # so you can alert on it while the probe keeps succeeding. Mutually exclusive
  # with ca_file. Prefer ca_file where possible — this lowers security.
  - name: appliance
    interval: 1m
    tags:
      service: appliance
      environment: production
    http:
      url: https://192.0.2.10/
      tls:
        insecure_skip_verify: true

  # Per-target max_body_bytes override: raise the cap on a large page so the
  # full download time is measured (overrides the 1 MiB default above).
  - name: large-report
    tags:
      service: reporting
      environment: production
    http:
      url: https://example.org/report
      max_body_bytes: 8388608   # 8 MiB

  # Opt out of the body cap entirely (read the full body; memory then grows with
  # timeout x bandwidth, not a byte limit). Removes the DoS safeguard, so it is
  # only allowed per target (never in defaults) — use only for trusted targets.
  - name: full-transfer
    timeout: 30s
    tags:
      service: reporting
      environment: production
    http:
      url: https://example.org/full
      max_body_bytes: 0         # 0 = no cap

  # DNS target (0.2): resolve an A record via a specific resolver and check it.
  - name: dns-a-record
    interval: 30s
    tags:
      service: dns
      environment: production
    dns:
      server: 1.1.1.1
      query: example.org
      type: A
      expected:
        - 93.184.216.34

  # DNS MX check (no expected values: success = NOERROR, count via metrics).
  - name: dns-mx-record
    interval: 1m
    tags:
      service: dns
      environment: production
    dns:
      server: 1.1.1.1
      query: example.org
      type: MX

  # TCP connection check with optional banner validation (e.g. the SSH greeting).
  # Without banner_regex it only checks that a connection can be established.
  - name: ssh
    interval: 1m
    tags:
      service: ssh
      environment: production
    tcp:
      address: ssh.example.org:22
      expect:
        banner_regex:
          - "^SSH-2.0"
