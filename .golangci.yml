# golangci-lint v2 configuration.
#
# On top of the v2 default linters (errcheck, govet, ineffassign, staticcheck,
# unused) this enables:
#   - gosec:     security anti-patterns (the deliberate InsecureSkipVerify in the
#                HTTP transport is annotated with //nolint:gosec and stays quiet)
#   - bodyclose: every HTTP response body must be closed — critical for a probe
#   - misspell:  doc/comment typos
#
# Security scanning also runs out-of-band via `make vuln` (govulncheck).
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - gosec
    - bodyclose
    - misspell
  settings:
    errcheck:
      # Writes to stdout/stderr for user-facing output: an error is not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Test fixtures (httptest servers, redirect targets) intentionally do things
      # gosec flags (open redirects, etc.); keep gosec on production code only.
      - path: _test\.go
        linters:
          - gosec
